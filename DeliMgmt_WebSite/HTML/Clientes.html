<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="../CSS/Clientes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="../Js/auth.js" ></script>
  </head>
<body>
    <nav class="navbar navbar-expand-sm" style="background-color: #e3f2fd;">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">DeliMgmt</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto">
              <a class="nav-link active" aria-current="page" href="#" id="logoutBtn">Exit</a>
              <a class="nav-link active" href="Inventario.html">Inventario</a>
              <a class="nav-link active" href="Ventas.html">Ventas</a>
              <a class="nav-link active" href="Clientes.html">Clientes</a>
            </div>
          </div>
        </div>
      </nav>
      <header class="header">
        <h1>Sistema de Gestión de Clientes</h1>
        <div class="button-group">
            <button class="button" onclick="window.location.href='Inventario.html'">Inicio</button>
            <button class="button" onclick="window.location.href='HistorialCompras.html'">Historial de compras</button>
        </div>
    </header>

    <div class="container">
        <!-- Formulario de ingreso -->
        <section class="form-section">
            <h2>Agregar Nuevo Cliente</h2>
            <div class="form-grid">
                <input class="form-control clientes-1" type="text" placeholder="Nombre">
                <input class="form-control clientes-2" type="email" placeholder="Email">
                <input class="form-control clientes-3" type="tel" placeholder="Teléfono">
                <button class="btn btn-add" type="button">Agregar Cliente</button>
            </div>
        </section>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Clientes</h3>
                <div class="stat-number" id="total-clients">1</div>
            </div>
        </div>
        
        <!-- Lista de Clientes -->
        <div class="customers-grid" id="customers-grid">
            <!-- Los clientes serán agregados dinámicamente aquí -->
        </div>
    </div>
    <!-- Modal para Editar Cliente -->
<div id="editCustomerModal" class="modal fade" tabindex="-1" aria-labelledby="editCustomerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editCustomerModalLabel">Editar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editCustomerForm">
            <label for="edit-name">Nombre:</label>
            <input type="text" id="edit-name" class="form-control" placeholder=""/>
            
            <label for="edit-email">Correo Electrónico:</label>
            <input type="email" id="edit-email" class="form-control" placeholder="" />
  
            <label for="edit-phone">Teléfono:</label>
            <input type="text" id="edit-phone" class="form-control" placeholder="" />
            <div><br></div>
  
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <button type="button" id="cancel-edit" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="sessionExpiredModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">Sesión Expirada</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Tu sesión ha expirado. Por favor, inicia sesión nuevamente.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="redirectToLogin()">Iniciar Sesión</button>
            </div>
        </div>
    </div>
  </div>

  </body>
  <script type="module">
    import { logout } from '../Js/login.js'; // Asegúrate de que la ruta sea correcta

    document.getElementById('logoutBtn').addEventListener('click', logout);
</script>
  <script src="../JS/clients.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</html>
