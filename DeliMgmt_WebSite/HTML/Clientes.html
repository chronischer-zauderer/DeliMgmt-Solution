<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="../CSS/Clientes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="../Js/auth.js" ></script>
  </head>
<body>
    <nav class="navbar navbar-expand-sm" style="background-color: #e3f2fd;">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">DeliMgmt</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto">
              <a class="nav-link active" aria-current="page" href="#" id="logoutBtn">Exit</a>
              <a class="nav-link active" href="Inventario.html">Inventario</a>
              <a class="nav-link active" href="Ventas.html">Ventas</a>
              <a class="nav-link active" href="Clientes.html">Clientes</a>
            </div>
          </div>
        </div>
      </nav>
      <header class="header">
        <h1>Sistema de Gestión de Clientes</h1>
        <div class="button-group">
            <button class="button" onclick="window.location.href='Inventario.html'">Inicio</button>
            <button class="button" onclick="window.location.href='Registrar.html'">Registrar</button>
            <button class="button" onclick="window.location.href='HistorialCompras.html'">Historial de compras</button>
        </div>
    </header>

    <div class="container">
        <!-- Formulario de ingreso -->
        <section class="form-section">
            <h2>Agregar Nuevo Cliente</h2>
            <div class="form-grid">
                <input type="text" placeholder="Nombre">
                <input type="email" placeholder="Email">
                <input type="tel" placeholder="Teléfono">
                <button>Agregar Cliente</button>
            </div>
        </section>

        <!-- Estadísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Clientes</h3>
                <div class="stat-number">1</div>
            </div>
            <div class="stat-card">
                <h3>Clientes Activos</h3>
                <div class="stat-number">1</div>
            </div>
            <div class="stat-card">
                <h3>Clientes Inactivos</h3>
                <div class="stat-number">1</div>
            </div>
        </div>

        <!-- Lista de Clientes -->
        <div class="customers-grid">
            <!-- Cliente 1 -->
            <div class="customer-card">
                <div class="customer-header">
                    <span class="status status-active">Activo</span>
                </div>
                <div class="customer-info">
                    <div class="customer-name">Juan Pérez</div>
                    <div class="customer-contact">
                        <div>juan@email.com</div>
                        <div>555-0101</div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="edit-btn">Editar</button>
                    <button class="delete-btn">Eliminar</button>
                </div>
            </div>

            <!-- Cliente 2 -->
            <div class="customer-card">
                <div class="customer-header">
                    <span class="status status-inactive">Inactivo</span>
                </div>
                <div class="customer-info">
                    <div class="customer-name">María García</div>
                    <div class="customer-contact">
                        <div>maria@email.com</div>
                        <div>555-0102</div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="edit-btn">Editar</button>
                    <button class="delete-btn">Eliminar</button>
                </div>
            </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module">
      import { logout } from '../Js/login.js'; // Asegúrate de que la ruta sea correcta
      document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
  </body>
</html>
