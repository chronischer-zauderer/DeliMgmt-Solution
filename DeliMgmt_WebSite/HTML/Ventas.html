<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link rel="stylesheet" href="../CSS/Ventas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../Js/auth.js" ></script>
</head>
<body>
    <nav class="navbar navbar-expand-sm" style="background-color: #e3f2fd;">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">DeliMgmt</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav ms-auto">
              <a class="nav-link active" aria-current="page" href="#" id="logoutBtn">Exit</a>
              <a class="nav-link active" href="Inventario.html">Inventario</a>
              <a class="nav-link active" href="Ventas.html">Ventas</a>
              <a class="nav-link active" href="Clientes.html">Clientes</a>
            </div>
          </div>
        </div>
    </nav>
    <div class="container">
        <header class="header">
          <h1>Ventas</h1>
          <div class="search-bar">
            <input type="text" placeholder="Buscar..." />
            <button>Buscar</button>
          </div>
          <button class="button" onclick="window.location.href='Inventario.html'">
            Inicio
          </button>
        </header>
  
        <div class="main-content">
          <aside class="sidebar">
            <h2>Configuración de venta</h2>
            <div>
              <label><input type="checkbox" /> Ventas</label><br />
              <label><input type="checkbox" checked /> Crédito</label>
            </div>
            <div>
              <h3>Pagó con</h3>
              <input type="text" value="0" style="width: 100%" />
            </div>
            <div>
              <h3>Monto a pagar</h3>
              <p class="amount"></p>
              <p style="color: #f44336"></p>
              <p class="amount amount-red"></p>
              <h3>Deuda total</h3>
              <p class="amount"></p>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 20px;
              "
            >
              <button class="button">+</button>
              <button class="button button-red">×</button>
            </div>
          </aside>
  
          <main class="main-panel">
            <!-- Sección de acciones -->
            <section class="actions">
              <button class="button">Ventas</button>
              <div class="dropdown">
                <button class="button dropbtn">Informes</button>
                <div class="dropdown-content">
                  <button>Diario</button>
                  <button>Semanal</button>
                  <button>Mensual</button>
                </div>
              </div>
              <button class="button">Métodos de pago</button>
              <div class="dropdown">
                <button class="button dropbtn">Generar Factura</button>
                <div class="dropdown-content">
                  <button>Factura 1</button>
                  <button>Factura 2</button>
                </div>
              </div>
            </section>
  
            <section class="panel">
              <table>
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Importe</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="highlight">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                  </tr>
                  <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  margin-top: 10px;
                "
              >
                <button class="button">🖨</button>
              </div>
            </section>
  
            <section class="panel">
              <div
                style="display: flex; align-items: center; margin-bottom: 10px"
              >
                <input type="text" placeholder="" style="width: 200px" />
                <span style="margin-left: 20px"><strong>Cliente</strong> 👤</span>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>SaldoActual</th>
                    <th>FechaActual</th>
                    <th>UltimoPago</th>
                    <th>FechaPago</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="highlight">
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </section>
          </main>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { logout } from '../Js/login.js';
        document.getElementById('logoutBtn').addEventListener('click', logout);
    </script>
</body>
</html>
