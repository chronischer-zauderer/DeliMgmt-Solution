<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas - DeliMgmt</title>
    <link rel="stylesheet" href="../CSS/Ventas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-sm navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">DeliMgmt</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="#" id="logoutBtn">Salir</a>
                    <a class="nav-link" href="Inventario.html">Inventario</a>
                    <a class="nav-link" href="Ventas.html">Ventas</a>
                    <a class="nav-link" href="Clientes.html">Clientes</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
      <header class="header d-flex justify-content-between align-items-center my-3">
        <h1>Ventas</h1>
        <div class="search-bar input-group w-50">
          <input 
            type="text" 
            class="form-control" 
            id="searchProduct" 
            placeholder="Buscar producto por código o descripción" 
            aria-label="Buscar producto" 
          />
          <button class="btn btn-primary" id="searchButton">Buscar</button>
        </div>
      </header>
    
      <div class="row">
        <!-- Configuración de Venta -->
        <aside class="col-md-4 bg-light rounded p-3 shadow-sm">
          <h2 class="text-center mb-3">Configuración de Venta</h2>
          <!-- Selección de Cliente -->
          <div class="mb-3">
            <label for="clientSelect" class="form-label">Asignar Cliente</label>
            <div class="input-group">
              <input 
                type="text" 
                class="form-control" 
                id="clientSearch" 
                placeholder="Buscar cliente por ID o nombre"
                list="clientsList" 
              />
            
            </div>
            <datalist id="clientsList">
              <!-- Ejemplo de Clientes -->
              <option value="Juan Pérez (ID: 101)">
              <option value="Ana Gómez (ID: 102)">
            </datalist>
          </div>
    
          <!-- Opciones de Pago -->
          <div class="mb-3">
            <h5>Opciones de Pago</h5>
            <div class="form-check">
              <input 
                class="form-check-input" 
                type="radio" 
                name="paymentOptions" 
                id="paymentCash" 
                checked
              />
              <label class="form-check-label" for="paymentCash">Efectivo</label>
            </div>
            <div class="form-check">
              <input 
                class="form-check-input" 
                type="radio" 
                name="paymentOptions" 
                id="paymentCredit"
              />
              <label class="form-check-label" for="paymentCredit">Crédito</label>
            </div>
          </div>
    
          <!-- Monto y Deuda -->
          <div class="mb-3">
            <label for="paidAmount" class="form-label">Pagó con</label>
            <input 
              type="number" 
              class="form-control" 
              id="paidAmount" 
              value="0" 
              min="0"
            />
          </div>
          <div class="mb-3">
            <h5>Total a Pagar:</h5>
            <p class="fs-4 text-primary" id="totalAmount">$0.00</p>
          </div>
          <div class="mb-3">
            <h5>Deuda Total:</h5>
            <p class="fs-4 text-danger" id="debtAmount">$0.00</p>
          </div>
    
          <!-- Botones -->
          <div class="d-flex justify-content-between">
            <button class="btn btn-success btn-sm" id="addProductBtn">Agregar Producto</button>
            <button class="btn btn-danger btn-sm" id="clearSaleBtn">Limpiar</button>
          </div>
        </aside>
    
        <!-- Panel Principal -->
        <main class="col-md-8">
          <!-- Tabla de Productos -->
          <table class="table table-hover">
            <thead class="table-primary">
              <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Importe</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- Ejemplo de Producto -->
              <tr>
                <td>001</td>
                <td>Producto A</td>
                <td>$100.00</td>
                <td>2</td>
                <td>$200.00</td>
                <td>
                  <button class="btn btn-danger btn-sm removeProductBtn">×</button>
                </td>
              </tr>
            </tbody>
          </table>
    
          <!-- Botón para Procesar Venta -->
          <div class="text-end">
            <button class="btn btn-primary btn-lg" id="processSaleBtn">Procesar Venta</button>
          </div>
        </main>
      </div>
    </div>
    

    <!-- SCRIPTS -->
    <script type="module">
      import { logout } from '../Js/login.js'; // Asegúrate de que la ruta sea correcta

      document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Js/sales.js"></script>
</body>
</html>
